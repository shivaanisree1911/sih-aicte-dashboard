<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AICTE Grievance Monitoring Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; margin: 0; padding: 30px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    h1 { color: #0f172a; margin: 0; font-size: 24px; }
    
    /* Stat Cards */
    .stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); text-align: center; }
    .card h3 { margin: 0; font-size: 13px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .count { font-size: 32px; font-weight: 700; margin: 10px 0 0; }
    .text-total { color: #2563eb; }
    .text-pending { color: #eab308; }
    .text-resolved { color: #16a34a; }

    /* Search Control */
    .controls { display: flex; gap: 15px; margin-bottom: 15px; }
    .search-input { flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }

    /* Complaints Table */
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    th { background: #f8fafc; color: #475569; font-weight: 600; }
    
    /* Badges */
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; display: inline-block; }
    .badge-high { background: #fee2e2; color: #991b1b; }
    .badge-normal { background: #e0f2fe; color: #0369a1; }
    .badge-pending { background: #fef9c3; color: #854d0e; }
    .badge-resolved { background: #dcfce7; color: #166534; }

    /* Action Button */
    .btn-resolve { background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-resolve:hover { background: #15803d; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>
      <h1>AICTE Bureau Grievance Monitoring</h1>
      <p style="color: #64748b; margin: 4px 0 0;">Live Institutional Grievance Tracker & Analytics</p>
    </div>
    <a href="index.html" style="text-decoration: none; background: #2563eb; color: white; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: bold;">+ New Complaint</a>
  </div>

  <!-- Metric Counters -->
  <div class="stats-container">
    <div class="card">
      <h3>Total Complaints</h3>
      <div class="count text-total" id="totalCount">0</div>
    </div>
    <div class="card">
      <h3>Pending Review</h3>
      <div class="count text-pending" id="pendingCount">0</div>
    </div>
    <div class="card">
      <h3>Resolved Cases</h3>
      <div class="count text-resolved" id="resolvedCount">0</div>
    </div>
  </div>

  <!-- Search Filter -->
  <div class="controls">
    <input type="text" id="searchInput" class="search-input" placeholder="Search by institution name or keyword..." onkeyup="filterTable()">
  </div>

  <!-- Main Complaints Table -->
  <table>
    <thead>
      <tr>
        <th>Ticket ID</th>
        <th>Institution Name</th>
        <th>Category</th>
        <th>Issue Description</th>
        <th>Priority</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="complaintsTable">
      <tr>
        <td colspan="7" style="text-align: center; color: #64748b;">Loading complaints from backend...</td>
      </tr>
    </tbody>
  </table>

  <script>
    const backendUrl = "http://192.168.1.228:5000/api/complaints";

    async function loadComplaints() {
      try {
        const response = await fetch(backendUrl);
        const complaints = await response.json();

        const tableBody = document.getElementById('complaintsTable');
        tableBody.innerHTML = '';

        let total = complaints.length;
        let pending = 0;
        let resolved = 0;

        complaints.forEach(item => {
          const isResolved = (item.status || '').toLowerCase() === 'resolved';
          if (isResolved) resolved++;
          else pending++;

          const isHarassment = (item.category || '').toLowerCase().includes('ragging') || (item.category || '').toLowerCase().includes('harassment');
          const priorityBadge = isHarassment 
            ? '<span class="badge badge-high">High</span>' 
            : '<span class="badge badge-normal">Normal</span>';

          const statusBadge = isResolved
            ? '<span class="badge badge-resolved">Resolved</span>'
            : `<span class="badge badge-pending" id="status-${item.id}">Pending</span>`;

          const actionBtn = isResolved
            ? '<span style="color: #64748b; font-size: 12px;">Completed</span>'
            : `<button class="btn-resolve" onclick="markResolved('${item.id}')">Mark Resolved</button>`;

          const row = `
            <tr>
              <td><strong>#${item.id}</strong></td>
              <td>${item.college || 'N/A'}</td>
              <td>${item.category || 'General'}</td>
              <td>${item.description || ''}</td>
              <td>${priorityBadge}</td>
              <td>${statusBadge}</td>
              <td id="action-${item.id}">${actionBtn}</td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });

        document.getElementById('totalCount').textContent = total;
        document.getElementById('pendingCount').textContent = pending;
        document.getElementById('resolvedCount').textContent = resolved;

      } catch (err) {
        console.error("Failed to fetch complaints:", err);
        document.getElementById('complaintsTable').innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; color: #ef4444;">
              Unable to load complaints from ${backendUrl}. Check backend connection.
            </td>
          </tr>
        `;
      }
    }

    function markResolved(id) {
      const statusBadge = document.getElementById(`status-${id}`);
      const actionCell = document.getElementById(`action-${id}`);
      
      if (statusBadge) {
        statusBadge.textContent = "Resolved";
        statusBadge.className = "badge badge-resolved";
      }
      if (actionCell) {
        actionCell.innerHTML = '<span style="color: #64748b; font-size: 12px;">Completed</span>';
      }

      // Update counter UI
      let pending = parseInt(document.getElementById('pendingCount').textContent);
      let resolved = parseInt(document.getElementById('resolvedCount').textContent);
      if (pending > 0) {
        document.getElementById('pendingCount').textContent = pending - 1;
        document.getElementById('resolvedCount').textContent = resolved + 1;
      }
    }

    function filterTable() {
      const filter = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#complaintsTable tr');
      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(filter) ? '' : 'none';
      });
    }

    // Load data automatically when page opens
    loadComplaints();
  </script>
</body>
</html>
