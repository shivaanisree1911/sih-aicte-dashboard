<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AICTE Public Grievance Portal</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8fafc; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
    .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 520px; }
    h2 { margin-top: 0; color: #0f172a; font-size: 22px; }
    p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input[type="text"], select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; ring: 2px solid #93c5fd; }
    button { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .status-msg { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 14px; display: none; }
    .status-msg.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .status-msg.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Lodge Institutional Grievance</h2>
    <p>AICTE Centralized Student & Faculty Redressal Portal</p>

    <form id="grievanceForm">
      <div class="form-group">
        <label for="college">Institution Name</label>
        <input type="text" id="college" placeholder="e.g., Thiagarajar College of Engineering" required>
      </div>

      <div class="form-group">
        <label for="category">Grievance Category</label>
        <select id="category" required>
          <option value="Fee Issues">Fee Issues / Overcharging</option>
          <option value="Hostel/Infrastructure">Hostel & Campus Infrastructure</option>
          <option value="Academic Irregularity">Academic Irregularity</option>
          <option value="Harassment/Ragging">Harassment / Ragging (High Priority)</option>
          <option value="General">Other / General Administration</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Detailed Description</label>
        <textarea id="description" rows="4" placeholder="Clearly describe the grievance..." required></textarea>
      </div>

      <button type="submit" id="submitBtn">Submit Grievance</button>
    </form>

    <div id="statusMessage" class="status-msg"></div>
  </div>

  <script>
    const backendUrl = "https://sih-aicte-dashboard.onrender.com/api/complaints";
    const form = document.getElementById('grievanceForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = "Registering...";
      statusMsg.className = "status-msg";
      statusMsg.style.display = "none";

      const payload = {
        college: document.getElementById('college').value.trim(),
        category: document.getElementById('category').value,
        description: document.getElementById('description').value.trim()
      };

      try {
        const response = await fetch(backendUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to submit grievance');
        }

        statusMsg.className = "status-msg success";
        statusMsg.textContent = `Grievance registered successfully! Ticket ID: #${data.ticket_id}`;
        form.reset();

      } catch (err) {
        console.error(err);
        statusMsg.className = "status-msg error";
        statusMsg.textContent = "Could not register grievance. The cloud server might be waking up; please try again in 30 seconds.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Grievance";
      }
    });
  </script>
</body>
</html>
